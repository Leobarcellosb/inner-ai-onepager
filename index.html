<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/icon-inner-ai.png" />
    <title>Inner AI — Central de Inteligência</title>
    <meta name="description" content="Plataforma de inteligência para gestão de conteúdo e social media com IA." />

    <meta property="og:title" content="Inner AI — Central de Inteligência" />
    <meta property="og:description" content="Plataforma de inteligência para gestão de conteúdo e social media com IA." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/icon-inner-ai.png" />
  </head>

  <body>
    <div id="root"></div>
    <script>
      // Apply theme before first paint to prevent FOUC
      (function(){
        var t = localStorage.getItem('inner-theme') || 'dark';
        var resolved = t === 'system'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : t;
        if (resolved === 'light') document.documentElement.classList.add('light');
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
